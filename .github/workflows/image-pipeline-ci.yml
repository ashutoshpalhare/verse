name: Image Pipeline CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "pages/**"
      - "public/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
      - "ADMIN_GUIDE.md"
      - "LICENSE"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - "eslint.config.js"
      - "vite.config.ts"
      - "vite.pages.config.ts"

permissions:
  contents: read

jobs:
  verify-image-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run typecheck
      - name: ESLint
        run: bun run lint
      - name: Run image manifest regression tests
        run: bun run test:images
      - name: Build GitHub Pages site
        run: bun run build:pages
      - name: Test generated SEO pages
        run: bun run test:seo
